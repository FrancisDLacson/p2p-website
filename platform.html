<html lang="en">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --navy: #1E2856; --navy-deep: #14193A; --navy-lo: #2A356D; --navy-50: #7A86B8;
      --red: #C32A2E; --red-soft: #D86A6D; --ink: #0D1230; --slate: #3A3F55; --muted: #6B6E7D;
      --sand: #FAF6EE; --cream: #F4EFE2; --paper: #F6F4EE; --line: rgba(30,40,86,0.10);
      --line2: rgba(30,40,86,0.18); --ok: #0E7C44;
    }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--sand); color: var(--ink);
           font-family: 'Manrope', system-ui, sans-serif;
           -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .grotesk { font-family: 'Space Grotesk', sans-serif; }
    .news    { font-family: 'Newsreader', serif; }
    .plex    { font-family: 'IBM Plex Sans', sans-serif; }
    .mono    { font-family: 'JetBrains Mono', monospace; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</head>

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
