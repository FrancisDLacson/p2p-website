document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 both;}\n.hero-label-dot{width:6px;height:6px;background:var(--red);border-radius:50%;box-shadow:0 0 8px rgba(195,42,46,0.6);}\n.hero-label-text{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.5);}\n\nh1.hero-h{\n  font-family:'DM Sans',sans-serif;\n  font-size:clamp(48px,5.8vw,88px);\n  font-weight:700;line-height:1.0;letter-spacing:-3px;\n  color:#fff;\n  animation:fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.28s both;\n}\nh1.hero-h span{display:block;font-size:inherit;font-weight:700;letter-spacing:-3px;line-height:1.0;}\nh1.hero-h .dim{color:rgba(255,255,255,0.3);}\nh1.hero-h .combo{display:block;white-space:nowrap;font-size:clamp(44px,5.2vw,82px);letter-spacing:-3px;line-height:1.0;}\nh1.hero-h .combo .r{color:var(--red);}\nh1.hero-h .combo .d{color:rgba(255,255,255,0.3);}\n\n/* Animated underline accent on first word */\n.hero-h .under{position:relative;display:inline-block;}\n.hero-h .under::after{\n  content:'';position:absolute;left:0;bottom:-4px;\n  width:100%;height:3px;background:var(--red);\n  border-radius:2px;\n  animation:lineIn 1.2s cubic-bezier(0.16,1,0.3,1) 0.6s both;\n  transform-origin:left;\n}\n@keyframes lineIn{from{transform:scaleX(0);}to{transform:scaleX(1);}}\n\n.hero-right{animation:fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.44s both;}\n.hero-sub{\n  font-family:'DM Sans',sans-serif;\n  font-size:16px;font-weight:300;line-height:1.85;\n  color:rgba(255,255,255,0.65);margin-bottom:32px;\n  text-align:justify;text-justify:inter-word;\n}\n.hero-sub strong{color:#fff;font-weight:500;}\n.hero-btns{display:flex;flex-direction:column;gap:12px;}\n\n.btn-red{\n  display:inline-flex;align-items:center;justify-content:center;gap:10px;\n  background:var(--red);color:#fff;\n  padding:16px 30px;border-radius:40px;\n  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;text-decoration:none;\n  transition:background 0.18s,transform 0.15s,box-shadow 0.18s;\n  box-shadow:0 4px 20px rgba(195,42,46,0.4);\n}\n.btn-red:hover{background:var(--red-2);transform:translateY(-2px);box-shadow:0 8px 28px rgba(195,42,46,0.45);}\n.btn-red svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;flex-shrink:0;}\n.btn-ghost{\n  display:inline-flex;align-items:center;justify-content:center;\n  border:1.5px solid rgba(255,255,255,0.35);color:#fff;\n  padding:14px 27px;border-radius:40px;\n  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;text-decoration:none;\n  transition:border-color 0.18s,color 0.18s,background 0.18s;\n}\n.btn-ghost:hover{border-color:#fff;color:var(--navy);background:#fff;}\n\n/* Trust badges row */\n.hero-trust{\n  display:flex;align-items:center;gap:20px;\n  margin-top:28px;padding-top:28px;\n  border-top:1px solid rgba(255,255,255,0.15);\n}\n.trust-item{\n  display:flex;align-items:center;gap:7px;\n  font-family:'DM Sans',sans-serif;\n  font-size:11.5px;font-weight:500;letter-spacing:0.3px;\n  color:rgba(255,255,255,0.6);\n}\n.trust-item svg{width:13px;height:13px;fill:none;stroke:var(--red);stroke-width:2;flex-shrink:0;}\n\n/* Stats bar */\n.hero-stats{\n  display:grid;grid-template-columns:repeat(4,1fr);\n  position:relative;z-index:2;\n  background:var(--navy-deep);\n  animation:fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.6s both;\n}\n.stat-cell{\n  padding:22px 20px;\n  border-right:1px solid rgba(255,255,255,0.07);\n  position:relative;overflow:hidden;\n  transition:background 0.2s;\n}\n.stat-cell:last-child{border-right:none;}\n.stat-cell:hover{background:rgba(255,255,255,0.04);}\n.stat-cell::after{\n  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;\n  background:var(--red);transform:scaleX(0);transform-origin:left;\n  transition:transform 0.32s ease;\n}\n.stat-cell:hover::after{transform:scaleX(1);}\n.stat-n{\n  font-family:'DM Sans',sans-serif;font-size:38px;font-weight:700;\n  color:#fff;line-height:1;margin-bottom:8px;\n  display:flex;align-items:flex-start;gap:1px;\n}\n.stat-n sup{font-size:17px;margin-top:6px;}\n.stat-l{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:400;color:rgba(255,255,255,0.52);line-height:1.4;white-space:nowrap;}\n\n/* ─── TICKER ─────────────────────────────── */\n.ticker{background:var(--red);padding:11px 0;overflow:hidden;white-space:nowrap;cursor:default;}\n.ticker:hover .ticker-track{animation-play-state:paused;}\n.ticker-track{display:inline-flex;animation:tick 32s linear infinite;}\n.t-item{display:inline-flex;align-items:center;gap:20px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.92);padding:0 28px;}\n.t-dot{width:3px;height:3px;background:rgba(255,255,255,0.45);border-radius:50%;flex-shrink:0;}\n@keyframes tick{from{transform:translateX(0);}to{transform:translateX(-50%);}}\n\n/* ─── ABOUT ──────────────────────────────── */\n.about{display:grid;grid-template-columns:1fr 1fr;}\n.about-l{padding:64px 72px;display:flex;flex-direction:column;justify-content:center;background:var(--cream);border-right:1px solid var(--stone);}\n.about-r{padding:64px 72px;display:flex;flex-direction:column;justify-content:center;background:var(--navy);}\n\n.tag{display:inline-flex;align-items:center;gap:10px;margin-bottom:28px;}\n.tag-bar{width:28px;height:2px;background:var(--red);}\n.tag-bar.w{background:rgba(255,255,255,0.22);}\n.tag-lbl{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--red);}\n.tag-lbl.w{color:rgba(255,255,255,0.42);}\n\n.sh{font-family:'DM Sans',sans-serif;font-size:clamp(26px,2.6vw,42px);font-weight:700;letter-spacing:-0.8px;line-height:1.12;color:var(--navy);margin-bottom:24px;}\n.sh em{font-style:normal;font-weight:700;color:var(--red);}\n.sh.w{color:#fff;} .sh.w em{color:rgba(255,255,255,0.35);}\n\n.bt{font-family:'DM Sans',sans-serif;font-size:16px;font-weight:300;line-height:1.85;color:var(--mid);margin-bottom:18px;}\n.bt strong{color:var(--navy);font-weight:500;}\n\n.pq{margin:32px 0;padding:22px 28px;border-left:3px solid var(--red);background:var(--off);transition:border-color 0.2s;}\n.pq:hover{border-color:var(--navy);}\n.pq p{font-family:'DM Sans',sans-serif;font-size:16px;font-weight:400;font-style:italic;line-height:1.7;color:var(--navy);letter-spacing:-0.1px;}\n\n/* About right — stat list */\n.astat-list{display:flex;flex-direction:column;}\n.astat-row{\n  display:flex;align-items:center;justify-content:space-between;\n  padding:32px 0;border-bottom:1px solid rgba(255,255,255,0.07);\n}\n.astat-row:last-child{border-bottom:none;}\n.astat-n{font-family:'Cormorant Garamond',sans-serif;font-size:50px;font-weight:700;color:#fff;line-height:1;letter-spacing:-2px;}\n.astat-n sup{font-size:19px;letter-spacing:0;}\n.astat-txt{text-align:right;}\n.astat-lbl{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:rgba(255,255,255,0.82);margin-bottom:4px;}\n.astat-sub{font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:300;color:rgba(255,255,255,0.48);}\n.astat-acc{color:var(--red);}\n\n/* ─── PROCESS (NEW) ──────────────────────── */\n.process{background:var(--off);padding:64px 80px;}.process-grid{\n  display:grid;grid-template-columns:repeat(4,1fr);\n  gap:2px;background:var(--stone);\n  margin-top:40px;\n}\n.proc-card{\n  background:#fff;padding:36px 28px;position:relative;\n  border-top:3px solid transparent;\n  transition:border-color 0.25s,background 0.25s;\n}\n.proc-card:hover{border-color:var(--red);background:var(--navy);}\n.proc-num{\n  position:absolute;top:16px;right:20px;\n  font-family:'Cormorant Garamond',sans-serif;font-size:64px;font-weight:800;\n  color:rgba(26,40,81,0.28);line-height:1;\n  letter-spacing:-4px;pointer-events:none;\n  transition:color 0.25s;\n}\n.proc-card:hover .proc-num{color:rgba(255,255,255,0.3);}\n.proc-icon{\n  width:44px;height:44px;background:var(--off);border-radius:8px;\n  display:flex;align-items:center;justify-content:center;\n  margin-bottom:22px;\n  transition:background 0.25s;\n}\n.proc-card:hover .proc-icon{background:rgba(255,255,255,0.08);}\n.proc-icon svg{width:22px;height:22px;fill:none;stroke:var(--red);stroke-width:1.8;}\n.proc-title{font-family:'Cormorant Garamond',sans-serif;font-size:15.5px;font-weight:700;color:var(--navy);margin-bottom:14px;letter-spacing:-0.2px;transition:color 0.25s;}\n.proc-card:hover .proc-title{color:#fff;}\n.proc-body{font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:300;line-height:1.82;color:var(--muted);transition:color 0.25s;}\n.proc-card:hover .proc-body{color:rgba(255,255,255,0.5);}\n/* Connector arrow between cards */\n.proc-card::after{\n  content:'';\n  position:absolute;right:-13px;top:50%;transform:translateY(-50%);\n  width:0;height:0;\n  border-top:10px solid transparent;\n  border-bottom:10px solid transparent;\n  border-left:13px solid var(--stone);\n  z-index:3;\n}\n.proc-card:last-child::after{display:none;}\n\n/* ─── SERVICES ───────────────────────────── */\n.services{background:var(--cream);padding:64px 72px;}\n.svc-head{display:grid;grid-template-columns:1fr 1.5fr;gap:80px;align-items:end;margin-bottom:40px;}\n.svc-intro{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:300;line-height:1.85;color:var(--muted);}\n\n.svc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--stone);}\n.svc{\n  padding:44px 30px;border-right:1px solid var(--stone);\n  background:var(--cream);position:relative;overflow:hidden;\n  transition:background 0.28s;cursor:default;\n  min-height:340px;display:flex;flex-direction:column;\n}\n.svc:last-child{border-right:none;}\n.svc::before{\n  content:'';position:absolute;top:0;left:0;right:0;height:3px;\n  background:var(--red);transform:scaleX(0);transform-origin:left;\n  transition:transform 0.28s ease;\n}\n.svc:hover::before{transform:scaleX(1);}\n.svc:hover{background:var(--navy);}\n.svc-n{font-family:'Cormorant Garamond',sans-serif;font-size:12px;font-weight:700;color:var(--red);margin-bottom:20px;transition:opacity 0.28s;}\n.svc:hover .svc-n{opacity:0.5;}\n.svc-title{font-family:'DM Sans',sans-serif;font-size:14.5px;font-weight:700;color:var(--navy);line-height:1.45;margin-bottom:20px;transition:color 0.28s;letter-spacing:-0.2px;}\n.svc:hover .svc-title{color:#fff;}\n.svc-list{list-style:none;}\n.svc-list li{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:400;line-height:1.85;color:var(--muted);padding-left:14px;position:relative;transition:color 0.28s;}\n.svc-list li::before{content:'';position:absolute;left:0;top:10px;width:5px;height:1px;background:var(--red);transition:opacity 0.28s;}\n.svc:hover .svc-list li{color:rgba(255,255,255,0.5);}\n.svc:hover .svc-list li::before{opacity:0.4;}\n\n/* ─── PIP PLATFORM (redesigned) ─────────── */\n.pip{\n  background:var(--navy-deep);\n  padding:64px 80px;position:relative;overflow:hidden;\n}\n/* Subtle grid background */\n.pip-grid-bg{\n  position:absolute;inset:0;pointer-events:none;\n  background-image:\n    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);\n  background-size:48px 48px;\n  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);\n}\n.pip-inner{\n  display:grid;grid-template-columns:1fr 1fr;\n  gap:72px;align-items:center;position:relative;z-index:2;\n}\n/* P2P wordmark */\n.pip-wordmark{\n  font-family:'Cormorant Garamond',sans-serif;\n  font-size:52px;font-weight:700;\n  color:#fff;letter-spacing:-2.5px;line-height:1;\n  margin-bottom:20px;display:flex;align-items:baseline;gap:6px;\n}\n.pip-wordmark-2{color:var(--red);}\n.pip-wordmark-sep{font-size:24px;color:rgba(255,255,255,0.2);letter-spacing:0;margin:0 2px;}\n.pip-wordmark-sub{\n  font-family:'DM Sans',sans-serif;\n  font-size:14px;font-weight:600;letter-spacing:3px;\n  color:rgba(255,255,255,0.4);text-transform:uppercase;\n}\n.pip-product-name{\n  font-family:'Cormorant Garamond',sans-serif;\n  font-size:clamp(22px,2.4vw,34px);font-weight:700;\n  color:#fff;letter-spacing:-0.8px;line-height:1.12;\n  margin-bottom:22px;\n}\n.pip-desc{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:300;line-height:1.9;color:rgba(255,255,255,0.58);margin-bottom:32px;}\n.pip-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:36px;}\n.pip-tag{\n  background:rgba(255,255,255,0.04);\n  border:1px solid rgba(255,255,255,0.1);\n  padding:6px 14px;border-radius:4px;\n  font-family:'DM Sans',sans-serif;\n  font-size:11px;font-weight:500;letter-spacing:0.3px;\n  color:rgba(255,255,255,0.65);\n  transition:all 0.18s;cursor:default;\n}\n.pip-tag:hover{background:rgba(195,42,46,0.15);border-color:var(--red);color:#fff;}\n.pip-actions{display:flex;align-items:center;gap:20px;}\n.btn-pip-primary{\n  display:inline-flex;align-items:center;gap:9px;\n  background:var(--red);color:#fff;\n  padding:14px 26px;border-radius:40px;\n  font-family:'DM Sans',sans-serif;\n  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;text-decoration:none;\n  transition:background 0.18s,transform 0.15s;\n  box-shadow:0 4px 20px rgba(195,42,46,0.4);\n}\n.btn-pip-primary:hover{background:var(--red-2);transform:translateY(-1px);}\n.btn-pip-primary svg{width:15px;height:15px;flex-shrink:0;}\n.pip-deploy-note{\n  display:flex;align-items:center;gap:7px;\n  font-family:'DM Sans',sans-serif;\n  font-size:12px;font-weight:400;\n  color:rgba(255,255,255,0.4);\n}\n.pip-deploy-note svg{width:14px;height:14px;flex-shrink:0;stroke:rgba(255,255,255,0.3);}\n\n/* Dashboard mockup */\n.pip-mockup{\n  background:#111827;\n  border:1px solid rgba(255,255,255,0.09);\n  border-radius:12px;overflow:hidden;\n  box-shadow:0 32px 64px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.04);\n}\n.pip-chrome{\n  background:#1a2035;padding:10px 14px;\n  display:flex;align-items:center;gap:10px;\n  border-bottom:1px solid rgba(255,255,255,0.06);\n}\n.pip-chrome-dots{display:flex;gap:6px;}\n.pip-chrome-dot{width:10px;height:10px;border-radius:50%;display:block;}\n.pip-chrome-url{\n  flex:1;display:flex;align-items:center;gap:6px;\n  background:rgba(255,255,255,0.05);border-radius:4px;\n  padding:4px 10px;\n  font-family:'DM Sans',sans-serif;\n  font-size:10.5px;color:rgba(255,255,255,0.35);\n}\n.pip-chrome-url svg{width:10px;height:10px;flex-shrink:0;}\n.pip-chrome-right{\n  font-family:'DM Sans',sans-serif;\n  font-size:9px;font-weight:700;letter-spacing:1.5px;\n  color:#4ade80;background:rgba(74,222,128,0.1);\n  padding:3px 8px;border-radius:3px;\n}\n/* Dashboard body */\n.pip-dash{display:grid;grid-template-columns:44px 1fr;}\n.pip-sidebar{\n  background:#0f1623;padding:14px 0;\n  display:flex;flex-direction:column;align-items:center;gap:16px;\n  border-right:1px solid rgba(255,255,255,0.05);\n}\n.pip-sidebar-logo{\n  font-family:'Cormorant Garamond',sans-serif;\n  font-size:11px;font-weight:700;color:#fff;letter-spacing:-0.5px;\n  margin-bottom:4px;line-height:1;\n}\n.pip-sidebar-logo span{color:var(--red);}\n.pip-sidenav{display:flex;flex-direction:column;gap:4px;width:100%;}\n.pip-sidenav-item{\n  display:flex;align-items:center;justify-content:center;\n  padding:8px 0;cursor:default;transition:background 0.15s;\n  color:rgba(255,255,255,0.3);\n}\n.pip-sidenav-item.active{color:#fff;background:rgba(255,255,255,0.06);}\n.pip-sidenav-item svg{width:14px;height:14px;}\n.pip-readiness{\n  margin-top:auto;position:relative;\n  display:flex;align-items:center;justify-content:center;\n}\n.pip-readiness svg{width:36px;height:36px;}\n.pip-readiness-label{\n  position:absolute;\n  font-family:'Cormorant Garamond',sans-serif;\n  font-size:7px;font-weight:700;color:#fff;\n  text-align:center;line-height:1;\n}\n/* Main content */\n.pip-main{padding:14px 16px;display:flex;flex-direction:column;gap:10px;}\n.pip-dash-header{\n  display:flex;align-items:center;justify-content:space-between;\n  padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,0.05);\n}\n.pip-dash-title{\n  font-family:'DM Sans',sans-serif;\n  font-size:11px;font-weight:500;color:rgba(255,255,255,0.7);\n}\n.pip-dash-badge{\n  font-family:'DM Sans',sans-serif;\n  font-size:9px;font-weight:700;letter-spacing:1px;\n  color:#4ade80;background:rgba(74,222,128,0.1);\n  padding:2px 7px;border-radius:3px;\n}\n.pip-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}\n.pip-kpi{\n  background:rgba(255,255,255,0.03);\n  border:1px solid rgba(255,255,255,0.06);\n  border-radius:6px;padding:10px 10px 8px;\n}\n.pip-kpi-val{\n  font-family:'Cormorant Garamond',sans-serif;\n  font-size:18px;font-weight:700;color:#fff;\n  line-height:1;margin-bottom:3px;letter-spacing:-0.5px;\n}\n.pip-kpi-lbl{font-family:'DM Sans',sans-serif;font-size:9px;font-weight:500;color:rgba(255,255,255,0.4);letter-spacing:0.3px;}\n.pip-kpi-chg{font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:600;color:#4ade80;margin-top:4px;animation:pulse-soft 3s ease-in-out infinite;}\n.pip-kpi-chg.down{color:#f87171;}\n/* Spend chart */\n.pip-chart-wrap{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:6px;padding:10px 10px 0;}\n.pip-chart-label{font-family:'DM Sans',sans-serif;font-size:9px;font-weight:600;color:rgba(255,255,255,0.4);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:8px;}\n.pip-bars{display:flex;align-items:flex-end;gap:4px;height:50px;}\n.pip-bar{\n  flex:1;border-radius:2px 2px 0 0;\n  height:var(--h);\n  background:rgba(42,53,109,0.9);\n  transition:background 0.2s;\n}\n.pip-bar.active{background:var(--red);}\n.pip-bar:hover{background:rgba(255,255,255,0.25);}\n/* Category table */\n.pip-table{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:6px;overflow:hidden;}\n.pip-table-row{\n  display:grid;grid-template-columns:100px 1fr 36px;\n  align-items:center;gap:8px;\n  padding:7px 10px;border-bottom:1px solid rgba(255,255,255,0.04);\n}\n.pip-table-row:last-child{border-bottom:none;}\n.pip-tr-name{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:400;color:rgba(255,255,255,0.55);}\n.pip-tr-bar{display:block;height:3px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}\n.pip-tr-bar span{display:block;height:100%;background:rgba(42,53,109,0.9);border-radius:2px;}\n.pip-tr-val{font-family:'DM Sans',sans-serif;font-size:10.5px;font-weight:600;color:#fff;text-align:right;}\n\n/* ─── CLIENTS ────────────────────────────── */\n.clients{background:var(--off);padding:64px 72px;}\n.clients-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--stone);margin-bottom:40px;}\n.cl-item{background:var(--cream);padding:26px 30px;display:flex;align-items:center;justify-content:space-between;transition:background 0.18s,box-shadow 0.18s;cursor:default;}\n.cl-item:hover{background:var(--off);box-shadow:inset 3px 0 0 var(--red);}\n.cl-nm{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:var(--navy);}\n.badge{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;background:var(--off);color:var(--muted);border-radius:3px;white-space:nowrap;}\n.badge.live{background:rgba(195,42,46,0.1);color:var(--red);}\n\n.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--stone);}\n.q-card{background:var(--cream);padding:44px 36px;position:relative;overflow:hidden;transition:transform 0.24s ease,box-shadow 0.24s ease;}\n.q-card:hover{transform:translateY(-4px);box-shadow:0 12px 36px rgba(0,0,0,0.08);}\n.q-card::before{\n  content:'\"';position:absolute;top:14px;left:26px;\n  font-family:'Cormorant Garamond',sans-serif;font-size:100px;font-weight:700;\n  color:rgba(211,46,39,0.85);line-height:1;pointer-events:none;\n}\n.q-text{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:300;line-height:1.88;color:var(--mid);margin-top:36px;margin-bottom:26px;font-style:italic;}\n.q-div{height:1px;background:var(--stone);margin-bottom:18px;}\n.q-org{font-family:'Cormorant Garamond',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--navy);}\n.q-type{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:300;color:var(--muted);margin-top:4px;}\n\n/* ─── WHY US ──────────────────────────────── */\n.why{background:var(--navy-2);padding:64px 72px;}\n.why-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:rgba(255,255,255,0.04);margin-top:40px;}\n.why-card{background:var(--navy-2);padding:40px 26px;border-top:2px solid rgba(255,255,255,0.05);transition:border-color 0.22s,background 0.22s;}\n.why-card:hover{border-color:var(--red);background:rgba(255,255,255,0.03);}\n.why-n{font-family:'Cormorant Garamond',sans-serif;font-size:42px;font-weight:800;color:rgba(255,255,255,0.1);line-height:1;margin-bottom:20px;letter-spacing:-2px;}\n.why-t{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;color:rgba(255,255,255,0.9);margin-bottom:12px;}\n.why-b{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:300;line-height:1.82;color:rgba(255,255,255,0.6);}\n\n/* ─── CTA ─────────────────────────────────── */\n.cta{\n  background:var(--red);padding:64px 80px;\n  display:grid;grid-template-columns:1fr auto;gap:80px;align-items:center;\n  position:relative;overflow:hidden;\n}\n.cta::before{\n  content:'';position:absolute;right:-120px;top:50%;transform:translateY(-50%);\n  width:500px;height:500px;border-radius:50%;\n  background:rgba(0,0,0,0.08);pointer-events:none;\n}\n.cta-h{font-family:'Cormorant Garamond',sans-serif;font-size:clamp(30px,3.8vw,52px);font-weight:700;letter-spacing:-1.5px;line-height:1.04;color:#fff;}\n.cta-h em{font-style:italic;font-family:'DM Sans',sans-serif;font-weight:300;color:rgba(255,255,255,0.62);}\n.cta-sub{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:300;line-height:1.8;color:rgba(255,255,255,0.72);max-width:520px;margin-top:18px;}\n.cta-btns{display:flex;flex-direction:column;gap:12px;min-width:240px;}\n.btn-white{\n  display:inline-flex;align-items:center;justify-content:center;gap:10px;\n  background:#fff;color:var(--red);\n  padding:16px 30px;border-radius:40px;\n  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;text-decoration:none;\n  transition:background 0.18s,transform 0.15s;\n}\n.btn-white:hover{background:var(--off);transform:translateY(-2px);}\n.btn-white svg{width:16px;height:16px;fill:none;stroke:var(--red);stroke-width:2.5;}\n.btn-wborder{\n  display:inline-flex;align-items:center;justify-content:center;\n  border:1.5px solid rgba(255,255,255,0.45);color:#fff;\n  padding:14px 27px;border-radius:40px;\n  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;text-decoration:none;\n  transition:border-color 0.18s,background 0.18s;\n}\n.btn-wborder:hover{border-color:#fff;background:rgba(255,255,255,0.1);}\n\n/* ─── FOOTER ──────────────────────────────── */\nfooter{background:var(--navy-deep);padding:56px 72px 0;border-top:3px solid var(--red);}\n.foot-top{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:48px;padding-bottom:48px;border-bottom:1px solid rgba(255,255,255,0.07);}\n.foot-brand{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300;color:#fff;letter-spacing:0;margin-bottom:4px;}\n.foot-brand span{color:var(--red);}\n.foot-tag{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:300;color:rgba(255,255,255,0.5);line-height:1.78;margin:12px 0 18px;max-width:295px;}\n.foot-desc{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:300;line-height:1.88;color:rgba(255,255,255,0.4);max-width:295px;}\n.foot-h{font-family:'DM Sans',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:22px;}\n.foot-links{list-style:none;}\n.foot-links li{margin-bottom:11px;}\n.foot-links a{font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:300;color:rgba(255,255,255,0.55); t\"><\u002Fspan><\u002Fspan>\n    <span class=\"t-item\">MWBE Program Design <span class=\"t-dot\"><\u002Fspan><\u002Fspan>\n    <span class=\"t-item\">Race-Neutral Frameworks <span class=\"t-dot\"><\u002Fspan><\u002Fspan>\n    <span class=\"t-item\">P2P Platform <span class=\"t-dot\"><\u002Fspan><\u002Fspan>\n    <span class=\"t-item\">Procurement Optimization <span class=\"t-dot\"><\u002Fspan><\u002Fspan>\n    <span class=\"t-item\">Disparity Studies <span class=\"t-dot\"><\u002Fspan><\u002Fspan>\n    <span class=\"t-item\">Supplier Intelligence <span class=\"t-dot\"><\u002Fspan><\u002Fspan>\n    <span class=\"t-item\">Data &amp; Systems Integration <span class=\"t-dot\"><\u002Fspan><\u002Fspan>\n    <span class=\"t-item\">Economic Analysis <span class=\"t-dot\"><\u002Fspan><\u002Fspan>\n    <span class=\"t-item\">MWBE Program Design <span class=\"t-dot\"><\u002Fspan><\u002Fspan>\n    <span class=\"t-item\">Race-Neutral Frameworks <span class=\"t-dot\"><\u002Fspan><\u002Fspan>\n    <span class=\"t-item\">P2P Platform <span class=\"t-dot\"><\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ABOUT -->\n<section class=\"about\" id=\"about\" aria-labelledby=\"about-h\">\n  <div class=\"about-l\">\n    <div class=\"tag\" data-r=\"\"><div class=\"tag-bar\"><\u002Fdiv><span class=\"tag-lbl\">Who We Are<\u002Fspan><\u002Fdiv>\n    <h2 class=\"sh\" id=\"about-h\" data-r=\"\" data-d=\"1\">A second-generation firm<br><em>built on institutional trust.<\u002Fem><\u002Fh2>\n    <p class=\"bt\" data-r=\"\" data-d=\"2\">Miller³ Consulting was founded on a simple premise: <strong>public institutions deserve the same caliber of procurement intelligence<\u002Fstrong> that private markets take for granted. For over four decades, we've helped governments, transit authorities, and health systems build systems that are compliant — and competitive.<\u002Fp>\n    <div class=\"pq\" data-r=\"\" data-d=\"3\">\n      <p>\"We help institutions understand why their systems produce the outcomes they do — and what it takes to change them.\"<\u002Fp>\n    <\u002Fdiv>\n    <p class=\"bt\" data-r=\"\" data-d=\"4\">From the first MWBE programs of the 1980s to today's race-neutral analytics, our expertise spans the full arc of public procurement reform — not as legacy, but as <strong>living institutional knowledge<\u002Fstrong>.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"about-r\">\n    <div class=\"tag\" data-r=\"\"><div class=\"tag-bar w\"><\u002Fdiv><span class=\"tag-lbl w\">Impact by the Numbers<\u002Fspan><\u002Fdiv>\n    <div class=\"astat-list\" data-r=\"\" data-d=\"1\">\n      <div class=\"astat-row\">\n        <div class=\"astat-n\">40<sup>+<\u002Fsup><\u002Fdiv>\n        <div class=\"astat-txt\"><div class=\"astat-lbl\">Years in Practice<\u002Fdiv><div class=\"astat-sub\">Est. 1984 · <span class=\"astat-acc\">2nd generation<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"astat-row\">\n        <div class=\"astat-n\">100<sup>+<\u002Fsup><\u002Fdiv>\n        <div class=\"astat-txt\"><div class=\"astat-lbl\">Disparity Studies<\u002Fdiv><div class=\"astat-sub\">Court-defensible methodology<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"astat-row\">\n        <div class=\"astat-n\">$18<sup>B<\u002Fsup><\u002Fdiv>\n        <div class=\"astat-txt\"><div class=\"astat-lbl\">Spend Analyzed<\u002Fdiv><div class=\"astat-sub\">Across public institutions<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"astat-row\">\n        <div class=\"astat-n\">35<sup>+<\u002Fsup><\u002Fdiv>\n        <div class=\"astat-txt\"><div class=\"astat-lbl\">States Served<\u002Fdiv><div class=\"astat-sub\">Nationwide footprint<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- HOW WE WORK (NEW) -->\n<section class=\"process\" id=\"process\" aria-labelledby=\"proc-h\">\n  <div class=\"tag\" data-r=\"\"><div class=\"tag-bar\"><\u002Fdiv><span class=\"tag-lbl\">Our Approach<\u002Fspan><\u002Fdiv>\n  <h2 class=\"sh\" id=\"proc-h\" data-r=\"\" data-d=\"1\" style=\"max-width:480px;margin-bottom:0;\">From assessment<br><em>to lasting impact.<\u002Fem><\u002Fh2>\n  <div class=\"process-grid\">\n    <div class=\"proc-card\" data-r=\"\">\n      <div class=\"proc-num\">01<\u002Fdiv>\n      <div class=\"proc-icon\">\n        <svg viewBox=\"0 0 24 24\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.35-4.35\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"proc-title\">Discovery &amp; Audit<\u002Fdiv>\n      <div class=\"proc-body\">We map your existing procurement systems, vendor patterns, and policy landscape to understand exactly where performance gaps exist.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"proc-card\" data-r=\"\" data-d=\"1\">\n      <div class=\"proc-num\">02<\u002Fdiv>\n      <div class=\"proc-icon\">\n        <svg viewBox=\"0 0 24 24\"><path d=\"M9 11l3 3L22 4\"><\u002Fpath><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"proc-title\">Data Analysis &amp; Study<\u002Fdiv>\n      <div class=\"proc-body\">Statistical utilization reviews, disparity analysis, market availability studies — rigorous, defensible, and built to withstand legal scrutiny.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"proc-card\" data-r=\"\" data-d=\"2\">\n      <div class=\"proc-num\">03<\u002Fdiv>\n      <div class=\"proc-icon\">\n        <svg viewBox=\"0 0 24 24\"><polyline points=\"22 12 18 12 15 21 9 3 6 12 2 12\"><\u002Fpolyline><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"proc-title\">Strategy &amp; Design<\u002Fdiv>\n      <div class=\"proc-body\">We translate findings into actionable frameworks — procurement policies, DBE programs, technology architectures, and implementation roadmaps.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"proc-card\" data-r=\"\" data-d=\"3\">\n      <div class=\"proc-num\">04<\u002Fdiv>\n      <div class=\"proc-i st.toggle('scrolled',scrollY>80);},{passive:true});\n\n// Subtle parallax on photo background\nconst cityDiv=document.querySelector('.hero-city');\nwindow.addEventListener('scroll',()=>{\n  if(scrollY<window.innerHeight){\n    const pct = 40 + scrollY * 0.018;\n    cityDiv.style.backgroundPosition = `center ${pct}%`;\n  }\n},{passive:true});\n\n// Animated number counter for stat cells\nfunction animateCount(el, target, prefix, suffix, duration=1600){\n  const isFloat = target % 1 !== 0;\n  let start = null;\n  const step = ts => {\n    if(!start) start = ts;\n    const p = Math.min((ts - start) / duration, 1);\n    const ease = 1 - Math.pow(1 - p, 3);\n    const val = isFloat ? (ease * target).toFixed(1) : Math.round(ease * target);\n    el.textContent = prefix + val;\n    if(p < 1) requestAnimationFrame(step);\n    else el.textContent = prefix + target;\n  };\n  requestAnimationFrame(step);\n}\n\nconst statIO = new IntersectionObserver(entries => {\n  entries.forEach(e => {\n    if(!e.isIntersecting) return;\n    // Hero stat cells: target the <span> inside .stat-n\n    const spanEl = e.target.querySelector('.stat-n > span');\n    if(spanEl){\n      const raw = spanEl.textContent.replace(/[^0-9.]/g,'');\n      const prefix = spanEl.textContent.startsWith('$') ? '$' : '';\n      animateCount(spanEl, parseFloat(raw), prefix, '', 1600);\n    }\n    // About stat rows: target the text node of .astat-n, preserving <sup>\n    const astatEl = e.target.querySelector('.astat-n');\n    if(astatEl){\n      // Find the first text node (before the <sup>)\n      const textNode = Array.from(astatEl.childNodes).find(n => n.nodeType === 3);\n      if(textNode){\n        const raw = textNode.textContent.replace(/[^0-9.]/g,'');\n        const prefix = textNode.textContent.trim().startsWith('$') ? '$' : '';\n        const target = parseFloat(raw);\n        let start = null;\n        const step = ts => {\n          if(!start) start = ts;\n          const p = Math.min((ts - start) / 1600, 1);\n          const ease = 1 - Math.pow(1 - p, 3);\n          textNode.textContent = prefix + Math.round(ease * target);\n          if(p < 1) requestAnimationFrame(step);\n          else textNode.textContent = prefix + target;\n        };\n        requestAnimationFrame(step);\n      }\n    }\n    statIO.unobserve(e.target);\n  });\n},{threshold:0.3});\ndocument.querySelectorAll('.stat-cell, .astat-row').forEach(el=>statIO.observe(el));\n\n// Highlight active nav section\nconst sections = document.querySelectorAll('section[id], header[id]');\nconst navLinks = document.querySelectorAll('.nav-menu a:not(.nav-btn)');\nconst sectionIO = new IntersectionObserver(entries=>{\n  entries.forEach(e=>{\n    if(e.isIntersecting){\n      navLinks.forEach(a=>{\n        a.classList.toggle('active', a.getAttribute('href')==='#'+e.target.id);\n      });\n    }\n  });\n},{threshold:0.35});\nsections.forEach(s=>sectionIO.observe(s));\n<\u002Fscript>\n<script>\n(function(){\n  var hb = document.getElementById('navHamburger');\n  if (hb) hb.addEventListener('click', function(){ document.body.classList.toggle('nav-open'); });\n  document.querySelectorAll('.nav-item > a').forEach(function(a){\n    if (a.parentElement.querySelector('.nav-dropdown')) {\n      a.addEventListener('click', function(e){\n        if (window.innerWidth <= 860) { e.preventDefault(); a.parentElement.classList.toggle('open'); }\n      });\n    } else {\n      a.addEventListener('click', function(){ document.body.classList.remove('nav-open'); });\n    }\n  });\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
