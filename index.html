    :root {

    html { scroll-behavior: smooth; scroll-padding-top: 96px; }
    body { margin: 0; color: var(--ink);

             radial-gradient(1100px 720px at 88% -8%, rgba(195,42,46,0.055), transparent 58%),

           -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .grotesk { font-family: 'Space Grotesk', sans-serif; }
    .news    { font-family: 'Newsreader', serif; }

    /* ── Responsive / mobile ─────────────────────────────────────────── */

    }
    @media (max-width: 860px) {

      .nav-links, .nav-about, .nav-m3 { display: none !important; }
      .diag-main { grid-template-columns: 1fr !important; }

  <script>
    // Soft-premium scroll-reveal via the Web Animations API.
    // Nothing is hidden in CSS, so the page can NEVER render blank — each section just
    // plays a one-shot fade-up as it enters view and settles back to fully visible.
    (function () {
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;
      function vh() { return window.innerHeight || document.documentElement.clientHeight || 800; }
      function play(s, delay) {
        s.__revealed = true;
        if (!s.animate) return;
        try {
          s.animate(
            [{ opacity: 0, transform: 'translateY(28px)' }, { opacity: 1, transform: 'none' }],
            { duration: 720, delay: delay || 0, easing: 'cubic-bezier(0.22,0.61,0.36,1)', fill: 'backwards' }
          );
        } catch (e) { /* base state is visible — safe to ignore */ }
      }
      var pending = [];
      function check() {
        pending = pending.filter(function (s) {
          if (s.getBoundingClientRect().top < vh() * 0.88) { play(s, 0); return false; }
          return true;
        });
      }
      function setup() {
        var root = document.getElementById('root');
        var secs = root ? root.querySelectorAll('section') : [];
        if (!secs.length) { return setTimeout(setup, 150); }   // wait for React to mount
        var inView = 0;
        Array.prototype.forEach.call(secs, function (s) {
          if (s.getBoundingClientRect().top >= vh() * 0.88) { pending.push(s); }  // below fold → on scroll
          else { play(s, (inView++) * 90); }                                      // in view → gentle intro
        });
        var ticking = false;
        window.addEventListener('scroll', function () {
          if (!ticking) { ticking = true; requestAnimationFrame(function () { check(); ticking = false; }); }
        }, { passive: true });
        window.addEventListener('resize', function () { check(); }, { passive: true });
      }
      function start() {
        var go = function () { requestAnimationFrame(function () { requestAnimationFrame(setup); }); };
        if (document.fonts && document.fonts.ready) { document.fonts.ready.then(go); setTimeout(go, 700); }
        else go();
      }
      if (document.readyState === 'complete') start();
      else window.addEventListener('load', start);
    })();
  </script>
